<!-- my_all_in/templates/my_all_in/product_confirm_delete.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление товара</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .warning-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .product-name {
            font-size: 24px;
            font-weight: 600;
            color: #e74c3c;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .warning-text {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.4);
        }

        .btn-secondary {
            background: #e1e1e1;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d1d1d1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning-icon">⚠️</div>
        <h2>Подтверждение удаления</h2>
        <p class="warning-text">Вы уверены, что хотите удалить этот товар?</p>

        <div class="product-name">{{ product.name }}</div>

        <form method="POST">
            {% csrf_token %}
            <div class="actions">
                <button type="submit" class="btn btn-danger">🗑️ Да, удалить</button>
                <a href="{% url 'my_all_in:product_detail' product.id %}" class="btn btn-secondary">↺ Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
